name: Generate YouTube Video

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start AgentRouter Spoof Proxy
        run: |
          # Install and start the proxy using the official Docker installer
          curl -fsSL https://raw.githubusercontent.com/trefeon/agentrouter-spoof-proxy/main/scripts/install.sh | bash -s -- --yes --docker
          
          # Wait a few seconds for the proxy to initialize and obtain the WAF cookie
          sleep 10
          
          # Verify the proxy is healthy and ready
          curl -f http://localhost:8318/health

      - name: Run Video Pipeline
        env:
          # Point the Python script to the local proxy
          LLM_BASE_URL: "http://localhost:8318/v1"
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: "gpt-6.1-sol"
        run: python src/generate_and_upload.py

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: final_video.mp4
